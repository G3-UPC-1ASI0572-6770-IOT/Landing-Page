<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm bg-surface">
  <div class="max-w-7xl mx-auto px-margin-mobile md:px-margin-desktop py-3 md:py-4">
    <div class="flex items-center justify-between gap-sm lg:gap-gutter">
      <div class="flex items-center whitespace-nowrap">
        <img src="assets/images/logoparkingnow.png" alt="ParkingNow logo" class="h-8 md:h-9 w-auto object-contain"/>
      </div>

      <nav class="hidden lg:flex flex-1 justify-center items-center gap-gutter" aria-label="Main navigation">
        <a id="nav-benefits" class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#benefits">Benefits</a>
        <a id="nav-how" class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#how-it-works">How it works</a>
        <a id="nav-drivers" class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#drivers">For drivers</a>
        <a id="nav-owners" class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#owners">For owners</a>
        <a id="nav-faq" class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#faq">FAQ</a>
        <a id="nav-contact" class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#contact">Contact</a>
      </nav>

      <div class="flex items-center gap-xs md:gap-sm shrink-0 min-h-[42px]">
        <button id="lang-toggle" class="flex items-center justify-center gap-xs font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors px-2 py-1 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#00ACE8] min-w-[72px] h-[40px] whitespace-nowrap" type="button" aria-label="Change language">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">language</span>
          <span id="lang-label">EN</span>
        </button>
        <button id="cta-owner-header" class="hidden sm:inline-flex items-center justify-center font-label-md text-label-md border-2 border-[#00ACE8] text-[#00ACE8] hover:bg-[#00ACE8] hover:text-white px-sm py-xs rounded-lg transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#00ACE8] h-[40px] min-w-[168px] whitespace-nowrap" type="button">Join as Owner</button>
        <button id="cta-find-header" class="inline-flex items-center justify-center font-label-md text-label-md bg-[#00268A] text-white px-sm py-xs rounded-lg hover:opacity-90 transition-opacity focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#00ACE8] h-[40px] min-w-[124px] whitespace-nowrap" type="button">Find Parking</button>
      </div>
    </div>

    <nav class="mt-2 lg:hidden flex flex-wrap items-center justify-center gap-x-sm gap-y-1" aria-label="Mobile navigation">
      <a id="mnav-benefits" class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#benefits">Benefits</a>
      <a id="mnav-how" class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#how-it-works">How it works</a>
      <a id="mnav-drivers" class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#drivers">For drivers</a>
      <a id="mnav-owners" class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#owners">For owners</a>
      <a id="mnav-faq" class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#faq">FAQ</a>
      <a id="mnav-contact" class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#contact">Contact</a>
    </nav>
  </div>
</header>
